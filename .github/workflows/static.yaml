      - name: Correlate and Distribute Manifests into ./iac Tree
        run: |
          set -euo pipefail

          # Helper function to strip Kubernetes cluster-runtime state
          sanitize_manifest() {
            yq eval '
              del(.metadata.creationTimestamp) |
              del(.metadata.generation) |
              del(.metadata.resourceVersion) |
              del(.metadata.uid) |
              del(.metadata.managedFields) |
              del(.metadata.ownerReferences) |
              del(.status) |
              (.. | select(key == "values" and tag == "!!str")) style="literal"
            ' -
          }

          echo "=========================================================="
          echo "STAGE 1: Exporting AppProjects (matched by .appProject_config.yaml)"
          echo "=========================================================="
          # Level 1 directories: iac/apps, iac/platform, iac/secuirty
          while IFS= read -r marker; do
            TARGET_DIR=$(dirname "$marker")
            PROJECT_NAME=$(basename "$TARGET_DIR")
            echo "Checking Project directory: $TARGET_DIR (Project: $PROJECT_NAME)"

            if kubectl get appproject.argoproj.io "$PROJECT_NAME" -n argocd > /dev/null 2>&1; then
              echo "  -> Found in cluster. Exporting to: $TARGET_DIR/appproject.yaml"
              kubectl get appproject.argoproj.io "$PROJECT_NAME" -n argocd -o yaml | sanitize_manifest > "$TARGET_DIR/appproject.yaml"
            else
              echo "  -> [WARNING] No AppProject named '$PROJECT_NAME' found in cluster."
            fi
          done < <(find iac -name ".appProject_config.yaml")

          echo "=========================================================="
          echo "STAGE 2: Exporting ApplicationSets (matched by .kargoProject_config.yaml)"
          echo "=========================================================="
          # Level 2 directories: iac/apps/media, iac/platform/observability, etc.
          while IFS= read -r marker; do
            TARGET_DIR=$(dirname "$marker")
            STACK_NAME=$(basename "$TARGET_DIR")
            PARENT_DIR=$(basename "$(dirname "$TARGET_DIR")")
            echo "Checking Stack directory: $TARGET_DIR (Stack: $STACK_NAME, Project: $PARENT_DIR)"

            # Check if there is an ApplicationSet matching this stack name or parent-stack name
            MATCHING_APPSET=$(kubectl get applicationsets.argoproj.io -n argocd -l 'dynamic!=template' -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -E "(${STACK_NAME}|${PARENT_DIR}-${STACK_NAME})" | head -n 1 || true)

            if [ -n "$MATCHING_APPSET" ]; then
              echo "  -> Found ApplicationSet '$MATCHING_APPSET'. Exporting to: $TARGET_DIR/applicationset.yaml"
              kubectl get applicationset.argoproj.io "$MATCHING_APPSET" -n argocd -o yaml | sanitize_manifest > "$TARGET_DIR/applicationset.yaml"
            else
              # Also check if the stack generated an Application directly (e.g. apps-media-project)
              MATCHING_APP=$(kubectl get applications.argoproj.io -n argocd -l 'dynamic!=template' -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -E "(${PARENT_DIR}-${STACK_NAME}|${STACK_NAME})" | head -n 1 || true)
              if [ -n "$MATCHING_APP" ]; then
                echo "  -> Found Stack Application '$MATCHING_APP'. Exporting to: $TARGET_DIR/application.yaml"
                kubectl get application.argoproj.io "$MATCHING_APP" -n argocd -o yaml | sanitize_manifest > "$TARGET_DIR/application.yaml"
              else
                echo "  -> [INFO] No cluster object found for stack: $STACK_NAME"
              fi
            fi
          done < <(find iac -name ".kargoProject_config.yaml")

          echo "=========================================================="
          echo "STAGE 3: Exporting Leaf Applications (matched by .applicationSets_config.yaml)"
          echo "=========================================================="
          # Level 3 directories: iac/apps/media/plex, iac/secuirty/threat/trivy-operator, etc.
          while IFS= read -r marker; do
            TARGET_DIR=$(dirname "$marker")
            APP_NAME=$(basename "$TARGET_DIR")
            PARENT_STACK=$(basename "$(dirname "$TARGET_DIR")")
            echo "Checking Leaf App directory: $TARGET_DIR (App: $APP_NAME, Stack: $PARENT_STACK)"

            # Discover the Application in Argo CD containing the app folder name (e.g., 'plex' in 'media-plex-sets')
            MATCHING_APP=$(kubectl get applications.argoproj.io -n argocd -l 'dynamic!=template' -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -E "(${APP_NAME})" | head -n 1 || true)

            if [ -n "$MATCHING_APP" ]; then
              echo "  -> Found Application '$MATCHING_APP'. Exporting to: $TARGET_DIR/application.yaml"
              kubectl get application.argoproj.io "$MATCHING_APP" -n argocd -o yaml | sanitize_manifest > "$TARGET_DIR/application.yaml"
            else
              echo "  -> [WARNING] No Application matching '$APP_NAME' discovered in cluster."
            fi
          done < <(find iac -name ".applicationSets_config.yaml")

      - name: Inspect Working Tree & Ensure Diffs
        run: |
          echo "=== Git Working Tree Status ==="
          git status --short
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "No dynamic files were produced. Writing debug sync file to trigger PR pipeline test..."
            echo "Debug run at $(date -u)" > iac/RENDER_DEBUG.txt
          fi

      - name: Commit, Push, and Open Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Configure Git author identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are modified or untracked files
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected in workspace. Skipping PR creation."
            exit 0
          fi

          BRANCH_NAME="sync/rendered-static-manifests"

          # Switch to target branch locally or create a clean orphan/new branch
          git checkout -B "$BRANCH_NAME"

          # Stage all changes across iac/
          git add iac/
          git commit -m "chore(gitops): render dynamic templates into static manifests"

          # Force-push the branch directly to GitHub (avoids cherry-pick divergence)
          git push -u origin "$BRANCH_NAME" --force

          # Check if a PR already exists from this branch to static
          EXISTING_PR=$(gh pr list --base static --head "$BRANCH_NAME" --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #$EXISTING_PR already exists and has been updated with the latest commit."
          else
            echo "Opening new pull request against 'static'..."
            gh pr create \
              --base static \
              --head "$BRANCH_NAME" \
              --title "Promote Rendered Static Manifests to static" \
              --body "Automated PR containing static manifests rendered from \`main\` into the \`./iac\` hierarchy."
          fi

      - name: Output Pull Request Details
        run: |
          echo "PR Number: ${{ steps.cpr.outputs.pull-request-number }}"
          echo "PR URL:    ${{ steps.cpr.outputs.pull-request-url }}"
          echo "PR Action: ${{ steps.cpr.outputs.pull-request-operation }}"