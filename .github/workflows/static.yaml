name: Render and Distribute Static Manifests

on:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/**'
      - 'iac/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: render-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools (yq, kubectl)
        uses: mikefarah/yq@v4.44.1

      - name: Create Ephemeral KinD Cluster
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: argocd-render-engine
          wait: 120s

      - name: Create Argo CD Namespace
        run: |
          set -euo pipefail
          echo "Creating argocd namespace..."
          kubectl create namespace argocd

      - name: Configure Repository Authentication
        env:
          ARGO_GIT_URL_BASE64: ${{ secrets.ARGO_GIT_URL_BASE64 }}
          ARGO_GITHUB_TOKEN_BASE64: ${{ secrets.ARGO_GITHUB_TOKEN_BASE64 }}
          ARGO_GIT_NAME_BASE64: ${{ secrets.ARGO_GIT_NAME_BASE64 }}
          ARGO_GIT_TYPE_BASE64: ${{ secrets.ARGO_GIT_TYPE_BASE64 }}
          ARGO_GIT_HOSTKEY_BASE64: ${{ secrets.ARGO_GIT_HOSTKEY_BASE64 }}
        run: |
          set -euo pipefail

          echo "Populating Argo CD SSH known_hosts..."
          kubectl create configmap argocd-ssh-known-hosts-cm -n argocd \
            --from-literal=ssh_known_hosts="$(ssh-keyscan github.com 2>/dev/null)" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Applying SSH repository secret with base64 data..."
          cat <<EOF | kubectl apply -n argocd -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: ssh-github-creds
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          data:
            name: ${ARGO_GIT_NAME_BASE64}
            type: ${ARGO_GIT_TYPE_BASE64}
            url: ${ARGO_GIT_URL_BASE64}
            insecureIgnoreHostKey: ${ARGO_GIT_HOSTKEY_BASE64}
            sshPrivateKey: ${ARGO_GITHUB_TOKEN_BASE64}
          EOF

          # Verification: Inspect decoded secret metadata in cluster without leaking private key
          echo "Verifying created secret configuration..."
          kubectl get secret ssh-github-creds -n argocd && echo ""

      - name: Install Argo CD Core Control Plane (v3.5.7)
        run: |
          set -euo pipefail
          echo "Installing Argo CD v3.5.7 core manifests..."
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.7/manifests/install.yaml

          echo "Awaiting ApplicationSet controller availability..."
          kubectl rollout status deployment/argocd-applicationset-controller -n argocd --timeout=120s

          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
          helm pull oci://ghcr.io/akuity/kargo-charts/kargo --untar
          kubectl apply --server-side --force-conflicts -f kargo/resources/crds/
          rm -rf kargo

          # echo "Applying bootstrap files via applciation"
          # cat <<EOF | kubectl apply -n argocd -f -
          # apiVersion: argoproj.io/v1alpha1
          # kind: Application
          # metadata:
          #   name: bootstrap-github
          # spec:
          #   project: default
          #   syncPolicy:
          #     automated: {}
          #   source:
          #     repoURL: git@github.com:tylerhoadley/app-of-apps.git
          #     targetRevision: main
          #     path: bootstrap
          #     directory:
          #       recurse: true
          #   destination:
          #     server: https://kubernetes.default.svc
          #     namespace: argocd
          # EOF
          # echo " sleep to let bootstrap catchup"
          # sleep 60

      - name: Stage 1 - Apply & Reconcile AppProjects
        run: |
          set -euo pipefail
          echo "Applying Level-1 Project templates..."
          kubectl apply -n argocd -f bootstrap/01-dynamic-projects.yaml

          kubectl get applicationset dynamic-projects -n argocd \
            -o jsonpath='{range .status.conditions[*]}{"Type: "}{.type}{"\nStatus: "}{.status}{"\nReason: "}{.reason}{"\nMessage: "}{.message}{"\n---\n"}{end}'

          echo "Waiting for AppProjects to generate..."
          for i in {1..20}; do
            COUNT=$(kubectl get appprojects.argoproj.io -n argocd --no-headers 2>/dev/null | grep -v 'default' | wc -l || true)
            if [ "$COUNT" -ge 1 ]; then
              echo "AppProjects detected: $COUNT"
              kubectl get appprojects.argoproj.io -n argocd
              break
            fi
            sleep 2
          done
          

      - name: Stage 2 - Apply Stacks and ApplicationSets
        run: |
          set -euo pipefail
          echo "Applying Level-2 and Level-3 ApplicationSets explicitly..."
          if [ -f "bootstrap/02-dynamic-stacks.yaml" ]; then
            kubectl apply -n argocd -f bootstrap/02-dynamic-stacks.yaml
          fi
          kubectl get applicationset dynamic-stacks -n argocd \
            -o jsonpath='{range .status.conditions[*]}{"Type: "}{.type}{"\nStatus: "}{.status}{"\nReason: "}{.reason}{"\nMessage: "}{.message}{"\n---\n"}{end}'

          if [ -f "bootstrap/03-dynamic-applicationsets.yaml" ]; then
            kubectl apply -n argocd -f bootstrap/03-dynamic-applicationsets.yaml
          fi

          kubectl get applicationset dynamic-applicationsets -n argocd \
            -o jsonpath='{range .status.conditions[*]}{"Type: "}{.type}{"\nStatus: "}{.status}{"\nReason: "}{.reason}{"\nMessage: "}{.message}{"\n---\n"}{end}'

          echo "Awaiting generation stability across nested resources..."
          for i in {1..30}; do
            APP_COUNT=$(kubectl get applications.argoproj.io -n argocd --no-headers 2>/dev/null | wc -l || true)
            SET_COUNT=$(kubectl get applicationsets.argoproj.io -n argocd --no-headers 2>/dev/null | wc -l || true)

            echo "Cycle $i: Discovered $APP_COUNT Applications and $SET_COUNT ApplicationSets"

            if [ "$APP_COUNT" -gt 0 ]; then
              echo "Applications successfully generated!"
              break
            fi
            sleep 4
          done

      - name: Debug Controller Logs & Generator Errors
        if: always()
        run: |
          echo "=== KUBERNETES APPPROJECTS ==="
          kubectl get appprojects.argoproj.io -n argocd -o wide || true

          echo "=== KUBERNETES APPLICATIONSETS ==="
          kubectl get applicationsets.argoproj.io -n argocd -o wide || true

          echo "=== KUBERNETES APPLICATIONS ==="
          kubectl get applications.argoproj.io -n argocd -o wide || true

          echo "=== APPLICATIONSET CONTROLLER LOGS (LAST 150 LINES) ==="
          kubectl logs -n argocd deployment/argocd-applicationset-controller --tail=150 || true

      # - name: Correlate and Distribute Manifests into ./iac Tree
