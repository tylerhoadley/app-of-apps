name: Render and Distribute Static Manifests

on:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/**'
      - 'iac/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: render-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools (yq, kubectl)
        uses: mikefarah/yq@v4.44.1

      - name: Create Ephemeral KinD Cluster
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: argocd-render-engine
          wait: 120s

      - name: Create Argo CD Namespace
        run: |
          set -euo pipefail
          echo "Creating argocd namespace..."
          kubectl create namespace argocd

      - name: Configure Repository Authentication
        env:
          ARGO_GIT_URL_BASE64: ${{ secrets.ARGO_GIT_URL_BASE64 }}
          ARGO_GITHUB_TOKEN_BASE64: ${{ secrets.ARGO_GITHUB_TOKEN_BASE64 }}
          ARGO_GIT_NAME_BASE64: ${{ secrets.ARGO_GIT_NAME_BASE64 }}
          ARGO_GIT_TYPE_BASE64: ${{ secrets.ARGO_GIT_TYPE_BASE64 }}
          ARGO_GIT_HOSTKEY_BASE64: ${{ secrets.ARGO_GIT_HOSTKEY_BASE64 }}
        run: |
          set -euo pipefail

          echo "Populating Argo CD SSH known_hosts..."
          kubectl create configmap argocd-ssh-known-hosts-cm -n argocd \
            --from-literal=ssh_known_hosts="$(ssh-keyscan github.com 2>/dev/null)" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Applying SSH repository secret with base64 data..."
          cat <<EOF | kubectl apply -n argocd -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: ssh-github-creds
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          data:
            name: ${ARGO_GIT_NAME_BASE64}
            type: ${ARGO_GIT_TYPE_BASE64}
            url: ${ARGO_GIT_URL_BASE64}
            insecureIgnoreHostKey: ${ARGO_GIT_HOSTKEY_BASE64}
            sshPrivateKey: ${ARGO_GITHUB_TOKEN_BASE64}
          EOF

          # Verification: Inspect decoded secret metadata in cluster without leaking private key
          echo "Verifying created secret configuration..."
          kubectl get secret ssh-github-creds -n argocd && echo ""

      - name: Install Argo CD Core Control Plane (v3.5.7)
        run: |
          set -euo pipefail
          echo "Installing Argo CD v3.5.7 core manifests..."
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.7/manifests/install.yaml

          echo "Awaiting ApplicationSet controller availability..."
          kubectl rollout status deployment/argocd-applicationset-controller -n argocd --timeout=120s

          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
          helm pull oci://ghcr.io/akuity/kargo-charts/kargo --untar
          kubectl apply --server-side --force-conflicts -f kargo/resources/crds/
          rm -rf kargo

      - name: Stage 1 - Apply & Reconcile AppProjects
        run: |
          set -euo pipefail
          echo "Applying Level-1 Project templates..."
          kubectl apply -n argocd -f bootstrap/01-dynamic-projects.yaml

          kubectl get applicationset dynamic-projects -n argocd \
            -o jsonpath='{range .status.conditions[*]}{"Type: "}{.type}{"\nStatus: "}{.status}{"\nReason: "}{.reason}{"\nMessage: "}{.message}{"\n---\n"}{end}'

          echo "Waiting for AppProjects to generate..."
          for i in {1..20}; do
            COUNT=$(kubectl get appprojects.argoproj.io -n argocd --no-headers 2>/dev/null | grep -v 'default' | wc -l || true)
            if [ "$COUNT" -ge 1 ]; then
              echo "AppProjects detected: $COUNT"
              kubectl get appprojects.argoproj.io -n argocd
              break
            fi
            sleep 2
          done

      - name: Stage 2 - Apply Stacks and ApplicationSets
        run: |
          set -euo pipefail
          echo "Applying Level-2 and Level-3 ApplicationSets explicitly..."
          if [ -f "bootstrap/02-dynamic-stacks.yaml" ]; then
            kubectl apply -n argocd -f bootstrap/02-dynamic-stacks.yaml
          fi
          kubectl get applicationset dynamic-stacks -n argocd \
            -o jsonpath='{range .status.conditions[*]}{"Type: "}{.type}{"\nStatus: "}{.status}{"\nReason: "}{.reason}{"\nMessage: "}{.message}{"\n---\n"}{end}'

          if [ -f "bootstrap/03-dynamic-applicationsets.yaml" ]; then
            kubectl apply -n argocd -f bootstrap/03-dynamic-applicationsets.yaml
          fi

          kubectl get applicationset dynamic-applicationsets -n argocd \
            -o jsonpath='{range .status.conditions[*]}{"Type: "}{.type}{"\nStatus: "}{.status}{"\nReason: "}{.reason}{"\nMessage: "}{.message}{"\n---\n"}{end}'

          echo "Awaiting generation stability across nested resources..."
          for i in {1..30}; do
            APP_COUNT=$(kubectl get applications.argoproj.io -n argocd --no-headers 2>/dev/null | wc -l || true)
            SET_COUNT=$(kubectl get applicationsets.argoproj.io -n argocd --no-headers 2>/dev/null | wc -l || true)

            echo "Cycle $i: Discovered $APP_COUNT Applications and $SET_COUNT ApplicationSets"

            if [ "$APP_COUNT" -gt 0 ]; then
              echo "Applications successfully generated!"
              break
            fi
            sleep 4
          done

      - name: Debug Controller Logs & Generator Errors
        if: always()
        run: |
          echo "=== KUBERNETES APPPROJECTS ==="
          kubectl get appprojects.argoproj.io -n argocd -o wide || true

          echo "=== KUBERNETES APPLICATIONSETS ==="
          kubectl get applicationsets.argoproj.io -n argocd -o wide || true

          echo "=== KUBERNETES APPLICATIONS ==="
          kubectl get applications.argoproj.io -n argocd -o wide || true

          echo "=== APPLICATIONSET CONTROLLER LOGS (LAST 150 LINES) ==="
          kubectl logs -n argocd deployment/argocd-applicationset-controller --tail=150 || true

      - name: Correlate and Distribute Manifests into ./iac Tree
        run: |
          set -euo pipefail

          # -------------------------------------------------------------
          # Helper Function: Sanitize Manifests
          # Strips runtime tracking metadata and formats multi-line YAML
          # -------------------------------------------------------------
          sanitize_manifest() {
            yq eval -P '
              del(.metadata.creationTimestamp) |
              del(.metadata.generation) |
              del(.metadata.resourceVersion) |
              del(.metadata.uid) |
              del(.metadata.managedFields) |
              del(.metadata.ownerReferences) |
              del(.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration") |
              del(.metadata.annotations."argocd.argoproj.io/tracking-id") |
              del(.status) |
              (.. | select(key == "values" and tag == "!!str")) style="literal"
            ' -
          }

          # -------------------------------------------------------------
          # STAGE 1: APPPROJECTS (Level 1: matched by .appProject_config.yaml)
          # Target: iac/<proj>/<proj>.yaml
          # -------------------------------------------------------------
          echo "=========================================================="
          echo "STAGE 1: Exporting AppProjects"
          echo "=========================================================="
          while IFS= read -r marker; do
            TARGET_DIR=$(dirname "$marker")
            PROJECT_NAME=$(basename "$TARGET_DIR")
            echo "Checking Project: $PROJECT_NAME in $TARGET_DIR"

            if kubectl get appproject.argoproj.io "$PROJECT_NAME" -n argocd > /dev/null 2>&1; then
              LABEL_DYNAMIC=$(kubectl get appproject.argoproj.io "$PROJECT_NAME" -n argocd -o jsonpath='{.metadata.labels.dynamic}' 2>/dev/null || true)
              if [ "$LABEL_DYNAMIC" = "template" ]; then
                echo "  -> [SKIP] AppProject '$PROJECT_NAME' has label dynamic=template"
                continue
              fi

              echo "  -> Writing AppProject: $PROJECT_NAME -> $TARGET_DIR/$PROJECT_NAME.yaml"
              kubectl get appproject.argoproj.io "$PROJECT_NAME" -n argocd -o yaml | sanitize_manifest > "$TARGET_DIR/$PROJECT_NAME.yaml"
            else
              echo "  -> [WARNING] No AppProject named '$PROJECT_NAME' found in cluster"
            fi
          done < <(find iac -name ".appProject_config.yaml")

          # -------------------------------------------------------------
          # STAGE 2: DYNAMIC KARGO MANIFESTS (matched by .kargoProject_config.yaml)
          # Dynamically iterates all CRD kinds under *.kargo.akuity.io
          # Target: iac/<proj>/<stack>/<kind>.yaml (or <name>.yaml)
          # -------------------------------------------------------------
          echo "=========================================================="
          echo "STAGE 2: Exporting All Kargo Resources (kargo.akuity.io)"
          echo "=========================================================="

          # 1. Discover all active resource types in the kargo.akuity.io API group
          KARGO_RESOURCES=$(kubectl api-resources --api-group=kargo.akuity.io -o name 2>/dev/null | tr '\n' ' ' || true)
          echo "Discovered Kargo API kinds: $KARGO_RESOURCES"

          while IFS= read -r marker; do
            TARGET_DIR=$(dirname "$marker")
            STACK_NAME=$(basename "$TARGET_DIR")
            PARENT_DIR=$(basename "$(dirname "$TARGET_DIR")")
            echo "Checking Stack: $STACK_NAME (Parent: $PARENT_DIR) in $TARGET_DIR"

            # 2. Iterate across every discovered Kargo resource type
            for resource_type in $KARGO_RESOURCES; do
              # Query all instances across all namespaces formatted as: namespace/name (or _cluster_/name for cluster-scoped)
              ITEMS=$(kubectl get "$resource_type" -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{" "}{end}' 2>/dev/null || true)

              for item in $ITEMS; do
                ITEM_NS="${item%/*}"
                ITEM_NAME="${item#*/}"

                # Handle cluster-scoped items where namespace is empty
                KUBECTL_FLAGS=("-n" "$ITEM_NS")
                if [ -z "$ITEM_NS" ] || [ "$ITEM_NS" = "/" ]; then
                  KUBECTL_FLAGS=()
                fi

                # Fetch object JSON to inspect labels and kind
                OBJ_JSON=$(kubectl get "$resource_type" "$ITEM_NAME" "${KUBECTL_FLAGS[@]}" -o json 2>/dev/null || true)
                if [ -z "$OBJ_JSON" ]; then continue; fi

                # Skip root template generators if labeled with dynamic=template
                LABEL_DYNAMIC=$(echo "$OBJ_JSON" | jq -r '.metadata.labels.dynamic // empty')
                if [ "$LABEL_DYNAMIC" = "template" ]; then continue; fi

                # Check if this resource belongs to the current stack (by name or namespace match)
                if [[ "$ITEM_NAME" == *"$STACK_NAME"* ]] || \
                   [[ "$ITEM_NAME" == *"$PARENT_DIR-$STACK_NAME"* ]] || \
                   [[ "$ITEM_NS" == *"$STACK_NAME"* ]] || \
                   [[ "$ITEM_NS" == *"$PARENT_DIR-$STACK_NAME"* ]]; then

                  KIND=$(echo "$OBJ_JSON" | jq -r '.kind | ascii_downcase')

                  # Output filename based on Kind (e.g. stage.yaml, projectconfig.yaml, warehouse.yaml, project.yaml)
                  # If multiple objects of the same kind exist in the stack, suffix with item name
                  OUT_FILE="$TARGET_DIR/${KIND}.yaml"
                  if [ -f "$OUT_FILE" ]; then
                    OUT_FILE="$TARGET_DIR/${ITEM_NAME}.yaml"
                  fi

                  echo "  -> Writing Kargo [$KIND]: $ITEM_NAME -> $OUT_FILE"
                  echo "$OBJ_JSON" | sanitize_manifest > "$OUT_FILE"
                  kubectl get "$resource_type" "$ITEM_NAME" "${KUBECTL_FLAGS[@]}" -o yaml | sanitize_manifest > "$OUT_FILE
                fi
              done
            done
          done < <(find iac -name ".kargoProject_config.yaml")

          # -------------------------------------------------------------
          # STAGE 3: LEAF APPLICATIONSETS (Level 3: matched by .applicationSets_config.yaml)
          # Target: iac/<proj>/<stack>/<app>/<appset>.yaml
          # -------------------------------------------------------------
          echo "=========================================================="
          echo "STAGE 3: Exporting Leaf ApplicationSets"
          echo "=========================================================="
          while IFS= read -r marker; do
            TARGET_DIR=$(dirname "$marker")
            APP_NAME=$(basename "$TARGET_DIR")
            PARENT_STACK=$(basename "$(dirname "$TARGET_DIR")")
            echo "Checking Leaf ApplicationSet target: $APP_NAME (Stack: $PARENT_STACK) in $TARGET_DIR"

            # 03-dynamic-applicationsets generates ApplicationSets for each leaf application folder
            for appset in $(kubectl get applicationsets.argoproj.io -n argocd -o jsonpath='{.items[*].metadata.name}'); do
              LABEL_DYNAMIC=$(kubectl get applicationset.argoproj.io "$appset" -n argocd -o jsonpath='{.metadata.labels.dynamic}' 2>/dev/null || true)
              if [ "$LABEL_DYNAMIC" = "template" ]; then
                continue
              fi

              # Matches generated ApplicationSets like 'media-plex-sets', 'threat-trivy-operator-sets'
              if [[ "$appset" == *"$APP_NAME"* ]]; then
                echo "  -> Writing Leaf ApplicationSet: $appset -> $TARGET_DIR/$appset.yaml"
                kubectl get applicationset.argoproj.io "$appset" -n argocd -o yaml | sanitize_manifest > "$TARGET_DIR/$appset.yaml"
                break
              fi
            done
          done < <(find iac -name ".applicationSets_config.yaml")

      - name: Isolate Static Manifests and Open PR via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Configure Git author identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Back up generated iac/ tree and .github/CODEOWNERS outside the git workspace
          echo "Backing up rendered manifests and CODEOWNERS..."
          rm -rf /tmp/rendered-iac /tmp/codeowners-backup
          cp -r iac /tmp/rendered-iac

          if [ -f ".github/CODEOWNERS" ]; then
            mkdir -p /tmp/codeowners-backup
            cp .github/CODEOWNERS /tmp/codeowners-backup/CODEOWNERS
          fi

          # 2. Strip only the dynamic marker files and debug traces from the backup
          # Retains all *.md / *.MD documentation files and raw values.yaml files
          find /tmp/rendered-iac -name ".*_config.yaml" -delete
          find /tmp/rendered-iac -name "RENDER_DEBUG.txt" -delete

          # Fetch remote tracking branch index cleanly to prevent PR merge block
          git fetch origin static:static || true

          # 3. Switch cleanly to static (or create an empty branch if static does not exist)
          BRANCH_NAME="sync/rendered-static-manifests"
          if git ls-remote --exit-code --heads origin static > /dev/null 2>&1; then
            git checkout static
            # Wipe working tree so obsolete/pruned apps are removed
            git rm -rf . > /dev/null 2>&1 || true
          else
            echo "Remote 'static' branch not found. Initializing empty orphan branch..."
            git checkout --orphan static
            git rm -rf . > /dev/null 2>&1 || true
          fi

          # 4. Clean any untracked leftover files
          git clean -fdx

          # 5. Restore clean rendered manifests
          mkdir -p iac
          cp -r /tmp/rendered-iac/* iac/

          # 6. Restore .github/CODEOWNERS if present
          if [ -f "/tmp/codeowners-backup/CODEOWNERS" ]; then
            mkdir -p .github
            cp /tmp/codeowners-backup/CODEOWNERS .github/CODEOWNERS
            git add .github/CODEOWNERS
          fi

          # 7. Branch out to staging branch for PR creation
          git checkout -B "$BRANCH_NAME"

          # 8. Stage everything in iac/ (captures additions, edits, deletions, and markdown files)
          git add -A iac/

          if [ -z "$(git status --porcelain)" ]; then
            echo "No differences found between newly rendered manifests and existing static branch."
            exit 0
          fi

          # 9. Commit and force-push the clean snapshot
          git commit -m "chore(gitops): synchronize static manifests (prune obsolete, add new)"
          git push -u origin "$BRANCH_NAME" --force

          # 10. Open or update PR against static
          EXISTING_PR=$(gh pr list --base static --head "$BRANCH_NAME" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #$EXISTING_PR updated with latest changes."
            echo "PR URL: $(gh pr view "$EXISTING_PR" --json url --jq '.url')"
          else
            NEW_PR_URL=$(gh pr create \
              --base static \
              --head "$BRANCH_NAME" \
              --title "Promote Rendered Static Manifests to static" \
              --body "Automated promotion containing solely static manifests and documentation under \`iac/\`." \
              | tail -n 1)
            echo "Created Pull Request: $NEW_PR_URL"
          fi
